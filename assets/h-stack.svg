<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 830 44'
    style='background-color: #0D1117;'
    width='830px' height='44px'>

    <style>
@font-face {
  font-family: 'Press Start 2P';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='100000000ms' fill='freeze'
                    values='m0,22 h0 ; m0,22 h830 ; m0,22 h830 ; m0,22 h830' keyTimes='0;8.0E-9;0.999999998;1' />
                    </path>
    <text font-family='"Press Start 2P", monospace' fill='#00FF00' font-size='18'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            &gt;_ cat stack.txt
        </textPath>
    </text>
</svg>
