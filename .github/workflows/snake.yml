name: generate snake

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Taipei
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render the contribution grid as a snake game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Matrix palette. Dot 0 is #161b22 so empty cells stay visible on a white
          # background too — the README never relies on the reader's theme colour.
          outputs: |
            dist/snake.svg?color_snake=#00ff00&color_dots=#161b22,#003b00,#007a00,#00c000,#00ff00

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
